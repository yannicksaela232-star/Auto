name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Extrair projeto
        run: unzip -o vipussd-app-v2.zip
      - name: Compilar APK
        working-directory: VIPussd
        run: gradle assembleDebug --no-daemon
      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: vip-ussd-apk
          path: VIPussd/app/build/outputs/apk/debug/app-debug.apk
          
